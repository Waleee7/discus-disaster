<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">DISCUS DISASTER</title>
  <desc id="d">A discus arcs across a night stadium under floodlights toward a flock of pigeons.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03050c"/><stop offset="0.7" stop-color="#0b1330"/><stop offset="1" stop-color="#2a1a14"/>
    </linearGradient>
    <radialGradient id="flood"><stop offset="0" stop-color="#fff3d6" stop-opacity="0.95"/><stop offset="0.35" stop-color="#ffb25c" stop-opacity="0.35"/><stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/></radialGradient>
    <linearGradient id="turf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f6a32"/><stop offset="1" stop-color="#0f3a1c"/></linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff8a1f" stop-opacity="0"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0.95"/></linearGradient>
    <style>
      .title{font:700 104px 'Oswald','Arial Narrow',Impact,sans-serif;letter-spacing:2px}
      .sub{font:500 22px 'JetBrains Mono',ui-monospace,Menlo,monospace;letter-spacing:5px;fill:#ffb25c}
      .pulse{animation:pulse 3.2s ease-in-out infinite}
      .blink{animation:blink 1.1s steps(2) infinite}
      .spin{transform-box:fill-box;transform-origin:center;animation:spin .45s ease-in-out infinite}
      .flap{transform-box:fill-box;transform-origin:center;animation:flap .35s ease-in-out infinite alternate}
      .slide{animation:slide 4.2s ease-out infinite}
      @keyframes pulse{50%{opacity:.55}}
      @keyframes blink{50%{opacity:.2}}
      @keyframes spin{50%{transform:scaleY(.45) rotate(8deg)}}
      @keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.25)}}
      @keyframes slide{0%{stroke-dashoffset:1500}60%,100%{stroke-dashoffset:0}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="1280" height="360" fill="url(#sky)"/>
  <g fill="#fff" opacity=".8">
    <circle cx="90" cy="40" r="1.4"/><circle cx="260" cy="70" r="1.2"/><circle cx="420" cy="30" r="1.5"/><circle cx="700" cy="46" r="1.2"/><circle cx="930" cy="26" r="1.4"/><circle cx="1130" cy="62" r="1.2"/><circle cx="1220" cy="30" r="1.5"/>
  </g>
  <!-- floodlights -->
  <g class="pulse"><circle cx="110" cy="70" r="90" fill="url(#flood)"/><circle cx="1170" cy="70" r="90" fill="url(#flood)"/></g>
  <g fill="#fff3d6"><rect x="86" y="56" width="48" height="30"/><rect x="1146" y="56" width="48" height="30"/></g>
  <!-- crowd bowl -->
  <path d="M0 250 Q640 190 1280 250 L1280 300 L0 300 Z" fill="#10141f"/>
  <g class="pulse" fill="#ff8a1f" opacity=".7">
    <rect x="60" y="238" width="6" height="8"/><rect x="150" y="232" width="6" height="8"/><rect x="330" y="224" width="6" height="8"/><rect x="520" y="218" width="6" height="8"/><rect x="760" y="218" width="6" height="8"/><rect x="940" y="224" width="6" height="8"/><rect x="1110" y="232" width="6" height="8"/><rect x="1210" y="238" width="6" height="8"/>
  </g>
  <rect y="298" width="1280" height="62" fill="url(#turf)"/>
  <g stroke="#f4f8ff" stroke-opacity=".7" stroke-width="2" fill="none"><path d="M180 360 L520 300"/><path d="M1100 360 L760 300"/><path d="M0 330 Q640 296 1280 330" opacity=".4"/></g>
  <!-- pigeons -->
  <g fill="#8790a6">
    <g transform="translate(980 150)"><ellipse rx="16" ry="9"/><ellipse class="flap" cx="-2" cy="-8" rx="18" ry="6" fill="#646d82"/><circle cx="-16" cy="-2" r="5" fill="#2f9e7e"/></g>
    <g transform="translate(1040 120)"><ellipse rx="16" ry="9"/><ellipse class="flap" cx="-2" cy="-8" rx="18" ry="6" fill="#646d82" style="animation-delay:.12s"/><circle cx="-16" cy="-2" r="5" fill="#2f9e7e"/></g>
    <g transform="translate(1100 165)"><ellipse rx="16" ry="9"/><ellipse class="flap" cx="-2" cy="-8" rx="18" ry="6" fill="#646d82" style="animation-delay:.2s"/><circle cx="-16" cy="-2" r="5" fill="#2f9e7e"/></g>
  </g>
  <!-- trajectory -->
  <path class="slide" d="M -60 300 Q 640 -150 1340 300" fill="none" stroke="url(#trail)" stroke-width="5" stroke-linecap="round" stroke-dasharray="1500" stroke-dashoffset="1500"/>
  <g><animateMotion dur="4.2s" repeatCount="indefinite" path="M -60 300 Q 640 -150 1340 300" keyTimes="0;1" keySplines=".3 .1 .5 1" calcMode="spline"/><g class="spin"><ellipse rx="24" ry="9" fill="#cfd6e6" stroke="#ff7a10" stroke-width="4"/></g></g>
  <!-- title -->
  <text x="640" y="200" text-anchor="middle" class="title"><tspan fill="#f4f8ff">DISCUS </tspan><tspan fill="#ff8a1f">DISASTER</tspan></text>
  <text x="640" y="240" text-anchor="middle" class="sub">REAL LIFT. REAL DRAG. UNREAL PIGEONS.</text>
  <text x="1240" y="342" text-anchor="end" class="sub blink" style="font-size:15px;letter-spacing:3px;fill:#f4f8ff">74.35 M &#183; REAL WR &#183; ALEKNA 2024</text>
</svg>
